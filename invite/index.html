<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Caprichómetro · Invitación</title>
  <style>
    body { background:#0D0D0D; color:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px; box-sizing:border-box; text-align:center; }
    .card { background:#1C1E18; border:1px solid rgba(216,255,82,0.35); border-radius:24px; padding:32px 24px; max-width:360px; width:100%; box-shadow:0 16px 40px rgba(0,0,0,0.6); }
    .badge { display:inline-block; background:rgba(216,255,82,0.14); color:#D8FF52; font-size:11px; font-weight:700; letter-spacing:1px; padding:5px 12px; border-radius:50px; }
    .avatar { width:68px; height:68px; border-radius:50%; background:#A8B8F0; color:#1A1A1A; font-size:28px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:18px auto 12px; }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:#8E8E93; font-size:14px; line-height:1.45; margin:0 0 22px; }
    .btn { display:block; background:#D8FF52; color:#000000; font-weight:700; font-size:15px; padding:15px 20px; border-radius:16px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">PASE DE CÍRCULO PRIVADO</span>
    <div id="avatar" class="avatar">C</div>
    <h1 id="title">Invitación a Caprichómetro</h1>
    <p id="desc">Pulsa el botón para abrir la app y agregar a tu amigo directamente.</p>
    <a id="openBtn" class="btn" href="caprichometro://invite">Abrir en Caprichómetro</a>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var rawUser = params.get("u") || params.get("username") || params.get("user") || window.location.hash.replace("#", "") || "";
      var user = rawUser.replace(/^@/, "").trim().toLowerCase();
      var deepLink = user ? ("caprichometro://invite/" + encodeURIComponent(user)) : "caprichometro://invite";
      if (user) {
        document.getElementById("avatar").textContent = user.charAt(0).toUpperCase();
        document.getElementById("title").textContent = "@" + user;
        document.getElementById("desc").textContent = "Te ha invitado a su círculo privado en Caprichómetro para decidir caprichos en 5 minutos.";
      }
      var btn = document.getElementById("openBtn");
      btn.href = deepLink;
      setTimeout(function() {
        window.location.href = deepLink;
      }, 150);
    })();
  </script>
</body>
</html>
