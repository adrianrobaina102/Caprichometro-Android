name: Android Nightly E2E (UI + Firestore)

on:
  schedule:
    # Todos los días a las 04:23 UTC (05:23 hora peninsular, evitando horas en punto saturadas)
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: android-e2e-nightly
  cancel-in-progress: true

env:
  # Fecha límite automática para la ejecución nocturna programada
  NIGHTLY_END_DATE: "2026-12-20"

jobs:
  check-window:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 20

      - name: Evaluate active period and recent activity
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: running E2E suite."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY=$(date -u +%Y-%m-%d)
          if [ "$TODAY" \> "$NIGHTLY_END_DATE" ]; then
            echo "Nightly window ended after $NIGHTLY_END_DATE. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RECENT_COMMITS=$(git log -1 --since="24 hours ago" --format=%H)
          if [ -z "$RECENT_COMMITS" ]; then
            echo "No new commits on develop in the last 24h. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New commits detected within active window ($TODAY <= $NIGHTLY_END_DATE)."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  android-ui-and-firestore-integration:
    needs: check-window
    if: needs.check-window.outputs.should_run == 'true'
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20 for Firestore Emulator
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare CI Firebase & local config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          echo "WEB_CLIENT_ID=${WEB_CLIENT_ID:-}" > local.properties
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "caprichometro-ci-stub"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.caprichometro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI-STUB-KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Start Firestore Emulator
        run: |
          nohup npx --yes firebase-tools@13 emulators:start --only firestore --project caprichometro-ci-stub --config .github/firebase.json > /tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then
              echo "Firestore Emulator is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/firestore-emulator.log || true
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Compose UI & Firestore Integration tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a
          profile: Nexus 6
          emulator-options: -no-window -no-boot-anim -no-audio -no-snapshot-load -no-snapshot-save
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            app/build/reports/androidTests/connected/
          retention-days: 14
