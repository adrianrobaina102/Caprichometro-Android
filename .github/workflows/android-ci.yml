name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare CI Firebase & local config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          echo "WEB_CLIENT_ID=${WEB_CLIENT_ID:-}" > local.properties
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "caprichometro-ci-stub"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.caprichometro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI-STUB-KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Lint, Debug build & AndroidTest compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin --no-daemon --console=plain

      - name: Upload test & Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          retention-days: 14

  android-ui-and-firestore-integration:
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20 for Firestore Emulator
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare CI Firebase & local config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          echo "WEB_CLIENT_ID=${WEB_CLIENT_ID:-}" > local.properties
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "caprichometro-ci-stub"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.caprichometro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI-STUB-KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Start Firestore Emulator
        run: |
          nohup npx --yes firebase-tools@13 emulators:start --only firestore --project caprichometro-ci-stub --config .github/firebase.json > /tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then
              echo "Firestore Emulator is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/firestore-emulator.log || true
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Compose UI & Firestore Integration tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            app/build/reports/androidTests/connected/
          retention-days: 14
