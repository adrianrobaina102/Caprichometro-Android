name: Android CI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'shared-docs/**'
      - '**.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'shared-docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare CI stub Firebase & local config
        run: |
          echo "WEB_CLIENT_ID=" > local.properties
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "caprichometro-ci-stub"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.caprichometro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI-STUB-KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests, Lint & AndroidTest compilation
        run: ./gradlew testDebugUnitTest lintDebug compileDebugAndroidTestKotlin --no-daemon --console=plain

      - name: Upload test & Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          retention-days: 14
